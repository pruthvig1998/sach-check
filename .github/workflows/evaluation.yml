name: Offline evaluation

on: [push, pull_request]

permissions:
  contents: read

jobs:
  offline-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/run_eval.py --dry-run
      - run: python -m pytest -q
      - name: Run offline synthetic fixtures
        if: ${{ !cancelled() }}
        run: python scripts/run_eval.py --offline
      - name: Upload offline fixture results
        if: ${{ !cancelled() && hashFiles('cache/evaluation-offline-fixture.json') != '' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: evaluation-offline-fixtures
          path: cache/evaluation-offline-fixture.json
          if-no-files-found: error
